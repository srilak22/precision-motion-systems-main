<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="rcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1628" />
      <stop offset="50%" stop-color="#111A30" />
      <stop offset="100%" stop-color="#16223D" />
    </linearGradient>
    <linearGradient id="cabinetMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="pendantBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#rcBg)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Main Industrial Controller Enclosure (Left) -->
  <g transform="translate(130, 80)">
    <!-- Base Plinth -->
    <rect x="0" y="300" width="220" height="30" rx="3" fill="#0B1329" stroke="#334155" stroke-width="2" />
    
    <!-- Cabinet Main Body (IP54 Sealed Steel) -->
    <rect x="10" y="20" width="200" height="280" rx="6" fill="url(#cabinetMetal)" stroke="#64748B" stroke-width="2.5" />
    
    <!-- Cabinet Door Recess -->
    <rect x="20" y="30" width="180" height="260" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1.5" />

    <!-- Industrial Key Lock & Door Handle -->
    <rect x="30" y="150" width="10" height="30" rx="2" fill="#0B1329" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="35" cy="165" r="2.5" fill="#CBD5E1" />

    <!-- Cooling Exhaust Louvers -->
    <g stroke="#334155" stroke-width="2">
      <line x1="55" y1="45" x2="165" y2="45" />
      <line x1="55" y1="53" x2="165" y2="53" />
      <line x1="55" y1="61" x2="165" y2="61" />
    </g>

    <!-- Emergency Stop Push Button on Cabinet -->
    <circle cx="160" cy="95" r="14" fill="#EF4444" stroke="#7F1D1D" stroke-width="2" />
    <circle cx="160" cy="95" r="9" fill="#DC2626" />
    <circle cx="160" cy="95" r="18" fill="none" stroke="#FACC15" stroke-width="3" />

    <!-- Status Indicator Stack Light on Cabinet Corner -->
    <g transform="translate(145, -15)">
      <rect x="0" y="0" width="16" height="32" rx="3" fill="#1E293B" />
      <circle cx="8" cy="6" r="4" fill="#EF4444" opacity="0.3" />
      <circle cx="8" cy="16" r="4" fill="#FACC15" opacity="0.3" />
      <circle cx="8" cy="26" r="4" fill="#16C7E8" />
    </g>

    <!-- Front Diagnostic Ports & Power Switch -->
    <rect x="50" y="110" width="45" height="25" rx="3" fill="#0B1329" stroke="#334155" stroke-width="1" />
    <text x="72" y="126" fill="#16C7E8" font-family="monospace" font-size="9" text-anchor="middle">USB/ETH</text>

    <!-- Heavy Industrial Umbilical Cable exiting Cabinet -->
    <path d="M 180 270 Q 240 330 380 310" stroke="#0F172A" stroke-width="18" fill="none" />
    <path d="M 180 270 Q 240 330 380 310" stroke="#16C7E8" stroke-width="2" fill="none" stroke-dasharray="8 6" />
  </g>

  <!-- Handheld Industrial Robot Teach Pendant (Right) -->
  <g transform="translate(420, 60)">
    <!-- Ergonomic Handheld Enclosure with Bumper Guard -->
    <rect x="0" y="20" width="250" height="320" rx="24" fill="url(#pendantBody)" stroke="#16C7E8" stroke-width="3" />
    
    <!-- Rubberized Hand Grip Bumpers -->
    <path d="M -8 80 C -12 120 -12 240 -8 280 L 10 280 L 10 80 Z" fill="#334155" />
    <path d="M 258 80 C 262 120 262 240 258 280 L 240 280 L 240 80 Z" fill="#334155" />

    <!-- E-Stop on Top Right of Pendant -->
    <circle cx="215" cy="45" r="16" fill="#EF4444" stroke="#FACC15" stroke-width="3" />
    <circle cx="215" cy="45" r="10" fill="#DC2626" />

    <!-- 10.1-inch Color Touchscreen GUI -->
    <rect x="25" y="70" width="200" height="150" rx="6" fill="#020617" stroke="#334155" stroke-width="2" />

    <!-- 3D Robot Model Wireframe & Axis Coordinates on Screen -->
    <g stroke="#16C7E8" stroke-width="1.5" fill="none">
      <path d="M 50 170 L 80 130 L 110 145 L 140 105 L 155 110" />
      <circle cx="50" cy="170" r="4" fill="#16C7E8" />
      <circle cx="80" cy="130" r="4" fill="#16C7E8" />
      <circle cx="110" cy="145" r="4" fill="#16C7E8" />
      <circle cx="140" cy="105" r="4" fill="#16C7E8" />
      <circle cx="155" cy="110" r="4" fill="#38BDF8" />
    </g>
    <!-- Coordinate Readout on Screen -->
    <g fill="#94A3B8" font-family="monospace" font-size="9">
      <text x="170" y="95" fill="#38BDF8">X: 842.1</text>
      <text x="170" y="110" fill="#38BDF8">Y: -12.4</text>
      <text x="170" y="125" fill="#38BDF8">Z: 419.0</text>
      <text x="170" y="145" fill="#16C7E8">MODE: RUN</text>
      <text x="170" y="160" fill="#F8FAFC">OVRD: 100%</text>
    </g>

    <!-- Tactile Jogging Buttons (X+, X-, Y+, Y-, Z+, Z-) -->
    <g transform="translate(35, 235)">
      <rect x="0" y="0" width="36" height="30" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="18" y="20" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">X+</text>

      <rect x="44" y="0" width="36" height="30" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="62" y="20" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">X-</text>

      <rect x="88" y="0" width="36" height="30" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="106" y="20" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Y+</text>

      <rect x="132" y="0" width="36" height="30" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="150" y="20" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Y-</text>

      <!-- 3-Position Enabling Deadman Switch Symbol -->
      <rect x="44" y="42" width="90" height="28" rx="4" fill="#334155" stroke="#16C7E8" stroke-width="1.5" />
      <text x="89" y="60" fill="#16C7E8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">ENABLE (DEADMAN)</text>
    </g>
  </g>

  <!-- Technical Labels -->
  <g transform="translate(40, 440)">
    <rect width="270" height="28" rx="4" fill="rgba(17,26,48,0.9)" stroke="#16C7E8" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#16C7E8" />
    <text x="30" y="18" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">INDUS // MULTI-AXIS ROBOT CONTROLLER</text>
  </g>
  <g transform="translate(500, 440)">
    <text x="260" y="18" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="10" letter-spacing="1.5">CABINET + HANDHELD TEACH PENDANT</text>
  </g>
</svg>
