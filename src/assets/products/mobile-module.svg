<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="modBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1628" />
      <stop offset="50%" stop-color="#111A30" />
      <stop offset="100%" stop-color="#16223D" />
    </linearGradient>
    <linearGradient id="polyurethaneTire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="mechMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#modBg)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Vertical Steerable Drive Unit Assembly -->
  <g transform="translate(260, 50)">
    <!-- Top Chassis Mounting Ring (360-deg Steering Slew Ring) -->
    <ellipse cx="140" cy="50" rx="130" ry="24" fill="#334155" stroke="#95CC00" stroke-width="2" />
    <ellipse cx="140" cy="46" rx="110" ry="20" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
    
    <!-- Steering Gear Teeth on Outer Slew Ring -->
    <g stroke="#95CC00" stroke-width="2">
      <line x1="20" y1="46" x2="20" y2="54" />
      <line x1="50" y1="40" x2="50" y2="48" />
      <line x1="90" y1="34" x2="90" y2="42" />
      <line x1="140" y1="30" x2="140" y2="38" />
      <line x1="190" y1="34" x2="190" y2="42" />
      <line x1="230" y1="40" x2="230" y2="48" />
      <line x1="260" y1="46" x2="260" y2="54" />
    </g>

    <!-- Vertical Steering Servomotor Unit (Top Left) -->
    <g transform="translate(190, -10)">
      <rect x="0" y="0" width="55" height="75" rx="3" fill="#0B1329" stroke="#38BDF8" stroke-width="2" />
      <rect x="10" y="-12" width="18" height="12" fill="#334155" />
      <circle cx="19" cy="-6" r="3" fill="#38BDF8" />
      <text x="27" y="40" fill="#38BDF8" font-family="monospace" font-size="8" text-anchor="middle">STEER MTR</text>
    </g>

    <!-- Main Vertical Traction Motor Body -->
    <rect x="70" y="70" width="140" height="130" rx="6" fill="url(#mechMetal)" stroke="#64748B" stroke-width="2" />
    <line x1="90" y1="70" x2="90" y2="200" stroke="#334155" stroke-width="2" />
    <line x1="120" y1="70" x2="120" y2="200" stroke="#334155" stroke-width="2" />
    <line x1="160" y1="70" x2="160" y2="200" stroke="#334155" stroke-width="2" />
    <text x="140" y="140" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">TRACTION SERVO</text>

    <!-- Suspension Shock Spring Structure -->
    <g stroke="#95CC00" stroke-width="3" fill="none">
      <path d="M 40 120 Q 30 135 40 150 Q 50 165 40 180 Q 30 195 40 210" />
      <line x1="30" y1="120" x2="50" y2="120" stroke="#94A3B8" />
      <line x1="30" y1="210" x2="50" y2="210" stroke="#94A3B8" />
    </g>

    <!-- Heavy-Duty Cast Wheel Fork / Bracket -->
    <path d="M 80 200 L 70 280 L 100 280 L 110 210 L 170 210 L 180 280 L 210 280 L 200 200 Z" fill="#334155" stroke="#475569" stroke-width="2" />

    <!-- Industrial Polyurethane Drive Traction Wheel -->
    <g transform="translate(90, 240)">
      <!-- Outer Polyurethane Tire (Hi-Traction Orange) -->
      <rect x="0" y="0" width="100" height="110" rx="14" fill="url(#polyurethaneTire)" stroke="#C2410C" stroke-width="2" />
      <!-- Tread Profile Grooves -->
      <line x1="20" y1="0" x2="20" y2="110" stroke="rgba(0,0,0,0.3)" stroke-width="2" />
      <line x1="50" y1="0" x2="50" y2="110" stroke="rgba(0,0,0,0.3)" stroke-width="2" />
      <line x1="80" y1="0" x2="80" y2="110" stroke="rgba(0,0,0,0.3)" stroke-width="2" />
      <!-- Center Wheel Hub Bearing Assembly -->
      <circle cx="50" cy="55" r="30" fill="#1E293B" stroke="#95CC00" stroke-width="2" />
      <circle cx="50" cy="55" r="14" fill="#64748B" stroke="#CBD5E1" stroke-width="2" />
      <circle cx="50" cy="55" r="5" fill="#0B1329" />
    </g>
  </g>

  <!-- Technical Labels -->
  <g transform="translate(40, 440)">
    <rect width="270" height="28" rx="4" fill="rgba(17,26,48,0.9)" stroke="#95CC00" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#95CC00" />
    <text x="30" y="18" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">INDUS // STEERABLE DRIVE UNIT</text>
  </g>
  <g transform="translate(500, 440)">
    <text x="260" y="18" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="10" letter-spacing="1.5">INTEGRATED STEERING + TRACTION + ENCODER</text>
  </g>
</svg>
