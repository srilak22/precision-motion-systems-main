<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fallbackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1628" />
      <stop offset="50%" stop-color="#111A30" />
      <stop offset="100%" stop-color="#16223D" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#fallbackBg)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Diagonal Engineering Grid Lines -->
  <line x1="0" y1="0" x2="800" y2="500" stroke="rgba(149,204,0,0.05)" stroke-width="1" />
  <line x1="0" y1="500" x2="800" y2="0" stroke="rgba(149,204,0,0.05)" stroke-width="1" />

  <!-- Precision Motion Geometry Shield -->
  <g transform="translate(340, 150)">
    <circle cx="60" cy="60" r="70" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" />
    <circle cx="60" cy="60" r="50" fill="#1E293B" stroke="#16C7E8" stroke-width="2.5" />
    
    <!-- Coordinate Triad (X, Y, Z) -->
    <path d="M 60 60 L 60 25" stroke="#16C7E8" stroke-width="3" stroke-linecap="round" />
    <path d="M 60 60 L 90 75" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <path d="M 60 60 L 30 75" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" />
    
    <circle cx="60" cy="25" r="4" fill="#16C7E8" />
    <circle cx="90" cy="75" r="4" fill="#38BDF8" />
    <circle cx="30" cy="75" r="4" fill="#F8FAFC" />
    <circle cx="60" cy="60" r="5" fill="#0B1329" stroke="#16C7E8" stroke-width="2" />
  </g>

  <!-- Branded Spec Typography -->
  <text x="400" y="320" fill="#F8FAFC" font-family="'Barlow Condensed', sans-serif" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="2">INDUS INDUSTRIAL ROBOTICS</text>
  <text x="400" y="345" fill="#16C7E8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="3">PRECISION COMPONENT HARDWARE</text>
  <text x="400" y="370" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">TECHNICAL SPECIFICATIONS AVAILABLE UPON REQUEST</text>

  <!-- Technical Calibration Markings -->
  <g stroke="#334155" stroke-width="1.5">
    <line x1="100" y1="50" x2="120" y2="50" />
    <line x1="100" y1="50" x2="100" y2="70" />

    <line x1="700" y1="50" x2="680" y2="50" />
    <line x1="700" y1="50" x2="700" y2="70" />

    <line x1="100" y1="450" x2="120" y2="450" />
    <line x1="100" y1="450" x2="100" y2="430" />

    <line x1="700" y1="450" x2="680" y2="450" />
    <line x1="700" y1="450" x2="700" y2="430" />
  </g>
</svg>
