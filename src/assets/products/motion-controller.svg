<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="mcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1628" />
      <stop offset="50%" stop-color="#111A30" />
      <stop offset="100%" stop-color="#16223D" />
    </linearGradient>
    <linearGradient id="rackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#mcBg)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Multi-Axis Motion Controller Rack Unit -->
  <g transform="translate(150, 90)">
    <!-- 19-inch Sub-Rack Chassis -->
    <rect x="0" y="0" width="500" height="280" rx="6" fill="url(#rackGrad)" stroke="#475569" stroke-width="3" />
    
    <!-- Rack Ear Mounting Brackets -->
    <rect x="-24" y="20" width="24" height="240" rx="3" fill="#334155" stroke="#64748B" stroke-width="1.5" />
    <circle cx="-12" cy="50" r="5" fill="#0B1329" stroke="#94A3B8" />
    <circle cx="-12" cy="230" r="5" fill="#0B1329" stroke="#94A3B8" />

    <rect x="500" y="20" width="24" height="240" rx="3" fill="#334155" stroke="#64748B" stroke-width="1.5" />
    <circle cx="512" cy="50" r="5" fill="#0B1329" stroke="#94A3B8" />
    <circle cx="512" cy="230" r="5" fill="#0B1329" stroke="#94A3B8" />

    <!-- CPU Module Slot 1 (Left) -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="130" height="240" rx="4" fill="#0B1329" stroke="#16C7E8" stroke-width="2" />
      <text x="65" y="25" fill="#16C7E8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">CPU CORE (4GHz)</text>
      
      <!-- Diagnostic Screen -->
      <rect x="15" y="38" width="100" height="40" rx="3" fill="#020617" stroke="#334155" stroke-width="1" />
      <text x="25" y="55" fill="#38BDF8" font-family="monospace" font-size="9">ETHERCAT DC: OK</text>
      <text x="25" y="70" fill="#16C7E8" font-family="monospace" font-size="9">JITTER: 0.12us</text>

      <!-- RJ45 Industrial Dual Master Ports -->
      <g transform="translate(20, 95)">
        <rect x="0" y="0" width="40" height="30" rx="2" fill="#1E293B" stroke="#16C7E8" stroke-width="1.5" />
        <rect x="50" y="0" width="40" height="30" rx="2" fill="#1E293B" stroke="#16C7E8" stroke-width="1.5" />
        <text x="20" y="42" fill="#94A3B8" font-family="monospace" font-size="8" text-anchor="middle">PRI</text>
        <text x="70" y="42" fill="#94A3B8" font-family="monospace" font-size="8" text-anchor="middle">SEC</text>
      </g>

      <!-- Fast Touch-Probe Nanosecond Registration Inputs -->
      <g transform="translate(20, 155)">
        <rect x="0" y="0" width="90" height="65" rx="3" fill="#1E293B" stroke="#64748B" stroke-width="1" />
        <circle cx="20" cy="20" r="6" fill="#0B1329" stroke="#16C7E8" stroke-width="1.5" />
        <circle cx="45" cy="20" r="6" fill="#0B1329" stroke="#16C7E8" stroke-width="1.5" />
        <circle cx="70" cy="20" r="6" fill="#0B1329" stroke="#16C7E8" stroke-width="1.5" />
        <circle cx="20" cy="45" r="6" fill="#0B1329" stroke="#38BDF8" stroke-width="1.5" />
        <circle cx="45" cy="45" r="6" fill="#0B1329" stroke="#38BDF8" stroke-width="1.5" />
        <circle cx="70" cy="45" r="6" fill="#0B1329" stroke="#38BDF8" stroke-width="1.5" />
        <text x="45" y="80" fill="#94A3B8" font-family="monospace" font-size="8" text-anchor="middle">PROBE INPUTS</text>
      </g>
    </g>

    <!-- Synchronized Multi-Axis Interpolation Graphic Slot 2 (Right) -->
    <g transform="translate(170, 20)">
      <rect x="0" y="0" width="310" height="240" rx="4" fill="#0B1329" stroke="#334155" stroke-width="1.5" />
      <text x="155" y="25" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">64-AXIS DETERMINISTIC SYNCHRONIZATION</text>

      <!-- Electronic Camming / Spline Curves Grid -->
      <g transform="translate(20, 45)">
        <rect x="0" y="0" width="270" height="135" fill="#020617" stroke="#1E293B" stroke-width="1" />
        <line x1="0" y1="67" x2="270" y2="67" stroke="#1E293B" stroke-width="1" />
        <line x1="90" y1="0" x2="90" y2="135" stroke="#1E293B" stroke-width="1" />
        <line x1="180" y1="0" x2="180" y2="135" stroke="#1E293B" stroke-width="1" />

        <!-- E-CAM Spline Trajectory 1 -->
        <path d="M 0 100 Q 60 10 135 67 T 270 30" fill="none" stroke="#16C7E8" stroke-width="2.5" />
        <!-- E-Gear Trajectory 2 -->
        <path d="M 0 40 Q 70 120 135 67 T 270 110" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 2" />

        <!-- Interpolation Nodes -->
        <circle cx="70" cy="30" r="4" fill="#16C7E8" />
        <circle cx="135" cy="67" r="4" fill="#F8FAFC" />
        <circle cx="210" cy="40" r="4" fill="#16C7E8" />
      </g>

      <!-- Status Indicator LEDs for 8 Coordinated Motion Groups -->
      <g transform="translate(25, 200)">
        <circle cx="10" cy="10" r="4" fill="#16C7E8" />
        <text x="18" y="13" fill="#94A3B8" font-family="monospace" font-size="8">GRP1</text>

        <circle cx="50" cy="10" r="4" fill="#16C7E8" />
        <text x="58" y="13" fill="#94A3B8" font-family="monospace" font-size="8">GRP2</text>

        <circle cx="90" cy="10" r="4" fill="#16C7E8" />
        <text x="98" y="13" fill="#94A3B8" font-family="monospace" font-size="8">GRP3</text>

        <circle cx="130" cy="10" r="4" fill="#16C7E8" />
        <text x="138" y="13" fill="#94A3B8" font-family="monospace" font-size="8">GRP4</text>

        <circle cx="170" cy="10" r="4" fill="#16C7E8" />
        <text x="178" y="13" fill="#94A3B8" font-family="monospace" font-size="8">GRP5</text>

        <circle cx="210" cy="10" r="4" fill="#16C7E8" />
        <text x="218" y="13" fill="#94A3B8" font-family="monospace" font-size="8">GRP6</text>

        <circle cx="250" cy="10" r="4" fill="#38BDF8" />
        <text x="258" y="13" fill="#94A3B8" font-family="monospace" font-size="8">CNC</text>
      </g>
    </g>
  </g>

  <!-- Technical Labels -->
  <g transform="translate(40, 440)">
    <rect width="270" height="28" rx="4" fill="rgba(17,26,48,0.9)" stroke="#16C7E8" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#16C7E8" />
    <text x="30" y="18" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">INDUS // MULTI-AXIS MOTION CONTROLLER</text>
  </g>
  <g transform="translate(500, 440)">
    <text x="260" y="18" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="10" letter-spacing="1.5">EtherCAT MASTER // 64 COHORTS // SUB-US JITTER</text>
  </g>
</svg>
