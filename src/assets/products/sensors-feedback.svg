<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sensBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1628" />
      <stop offset="50%" stop-color="#111A30" />
      <stop offset="100%" stop-color="#16223D" />
    </linearGradient>
    <linearGradient id="encoderDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="anodizedBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#sensBg)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Left Side: 26-bit Absolute Optical Hollow-Shaft Rotary Encoder -->
  <g transform="translate(140, 100)">
    <!-- Outer Housing -->
    <circle cx="130" cy="130" r="120" fill="url(#encoderDisc)" stroke="#475569" stroke-width="3" />
    <circle cx="130" cy="130" r="110" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="4 2" />

    <!-- Optical Track Radial Grating Pattern -->
    <circle cx="130" cy="130" r="95" fill="none" stroke="#16C7E8" stroke-width="4" stroke-dasharray="2 2" />
    <circle cx="130" cy="130" r="85" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="1 1" />
    <circle cx="130" cy="130" r="75" fill="none" stroke="#16C7E8" stroke-width="2" stroke-dasharray="3 2" />

    <!-- Hollow Shaft Center Ring -->
    <circle cx="130" cy="130" r="50" fill="#0B1329" stroke="#16C7E8" stroke-width="2.5" />
    <circle cx="130" cy="130" r="35" fill="#020617" />
    <text x="130" y="134" fill="#16C7E8" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">HOLLOW SHAFT</text>

    <!-- BiSS-C Industrial Output Cable Gland -->
    <rect x="220" y="40" width="35" height="20" rx="3" fill="#334155" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 255 50 Q 280 60 295 90" stroke="#16C7E8" stroke-width="4" fill="none" />

    <text x="130" y="275" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">26-BIT ABSOLUTE ENCODER</text>
    <text x="130" y="292" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">BATTERYLESS MULTI-TURN</text>
  </g>

  <!-- Right Side: 6-Axis Robot Wrist Force-Torque Sensor -->
  <g transform="translate(480, 100)">
    <!-- Outer Tool Flange (Anodized Industrial Finish) -->
    <circle cx="130" cy="130" r="120" fill="url(#anodizedBlue)" stroke="#0284C7" stroke-width="3" />
    <circle cx="130" cy="130" r="105" fill="#0B1329" stroke="#38BDF8" stroke-width="2" />

    <!-- 4x Internal Sensing Beams / Strain Gauge Bridges -->
    <rect x="122" y="30" width="16" height="60" rx="2" fill="#334155" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="122" y="170" width="16" height="60" rx="2" fill="#334155" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="30" y="122" width="60" height="16" rx="2" fill="#334155" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="170" y="122" width="60" height="16" rx="2" fill="#334155" stroke="#38BDF8" stroke-width="1.5" />

    <!-- Center Rigid Sensor Core -->
    <circle cx="130" cy="130" r="45" fill="#1E293B" stroke="#16C7E8" stroke-width="2.5" />
    
    <!-- 6-DoF Axis Vector Display (Fx, Fy, Fz / Tx, Ty, Tz) -->
    <line x1="130" y1="130" x2="130" y2="105" stroke="#16C7E8" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="130" y1="130" x2="155" y2="130" stroke="#16C7E8" stroke-width="2" />
    <circle cx="130" cy="130" r="4" fill="#16C7E8" />
    <text x="130" y="134" fill="#F8FAFC" font-family="monospace" font-size="8" text-anchor="middle">6-DoF</text>

    <!-- ISO Tool Flange Bolt Pattern (6x M6 Threaded Holes) -->
    <g fill="#475569" stroke="#CBD5E1" stroke-width="1.5">
      <circle cx="130" cy="40" r="4.5" />
      <circle cx="130" cy="220" r="4.5" />
      <circle cx="52" cy="85" r="4.5" />
      <circle cx="208" cy="85" r="4.5" />
      <circle cx="52" cy="175" r="4.5" />
      <circle cx="208" cy="175" r="4.5" />
    </g>

    <text x="130" y="275" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">6-AXIS FORCE-TORQUE SENSOR</text>
    <text x="130" y="292" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">SUB-NEWTON RESOLUTION</text>
  </g>

  <!-- Technical Labels -->
  <g transform="translate(40, 440)">
    <rect width="270" height="28" rx="4" fill="rgba(17,26,48,0.9)" stroke="#16C7E8" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#16C7E8" />
    <text x="30" y="18" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">INDUS // SENSORS &amp; FEEDBACK</text>
  </g>
  <g transform="translate(500, 440)">
    <text x="260" y="18" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="10" letter-spacing="1.5">OPTICAL ENCODERS + TACTILE SENSING</text>
  </g>
</svg>
