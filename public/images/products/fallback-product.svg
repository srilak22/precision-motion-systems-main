<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Light Neutral Engineering Background -->
    <linearGradient id="blueprintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Subtle Technical Calibration Grid -->
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#CBD5E1" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>
    <pattern id="majorGrid" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#techGrid)" />
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.35" />
    </pattern>

    <!-- Subtle Radial Glow for Hardware Schematic -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#blueprintBg)" />
  <rect width="800" height="600" fill="url(#majorGrid)" />
  <circle cx="400" cy="280" r="240" fill="url(#centerGlow)" />

  <!-- Diagonal Engineering Calibration Reference Lines -->
  <line x1="80" y1="80" x2="720" y2="480" stroke="#0EA5E9" stroke-width="0.75" stroke-dasharray="4 6" stroke-opacity="0.25" />
  <line x1="80" y1="480" x2="720" y2="80" stroke="#0EA5E9" stroke-width="0.75" stroke-dasharray="4 6" stroke-opacity="0.25" />

  <!-- Outer Structural Calibration Circle -->
  <g transform="translate(400, 270)">
    <!-- Dimension Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="115" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75" />
    <circle cx="0" cy="0" r="95" fill="#F8FAFC" stroke="#155EEF" stroke-width="2" stroke-opacity="0.7" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="3 3" />
    
    <!-- Precision Gear Pitch Circle / Spline Teeth Simulation -->
    <circle cx="0" cy="0" r="52" fill="#EFF6FF" stroke="#155EEF" stroke-width="2.2" />

    <!-- Coordinate Triad Axis Crosshair -->
    <path d="M 0 -75 L 0 75" stroke="#155EEF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
    <path d="M -75 0 L 75 0" stroke="#155EEF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
    
    <!-- Central Bearing Hub -->
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" />
    <circle cx="0" cy="0" r="10" fill="#155EEF" />

    <!-- Bolt Pattern Pitch Circle Nodes (8-point PCD) -->
    <circle cx="0" cy="-95" r="4" fill="#0F172A" />
    <circle cx="67" cy="-67" r="4" fill="#0F172A" />
    <circle cx="95" cy="0" r="4" fill="#0F172A" />
    <circle cx="67" cy="67" r="4" fill="#0F172A" />
    <circle cx="0" cy="95" r="4" fill="#0F172A" />
    <circle cx="-67" cy="67" r="4" fill="#0F172A" />
    <circle cx="-95" cy="0" r="4" fill="#0F172A" />
    <circle cx="-67" cy="-67" r="4" fill="#0F172A" />

    <!-- Angular Metric Callout Indicator -->
    <path d="M 75 -75 L 120 -115 L 175 -115" fill="none" stroke="#155EEF" stroke-width="1.5" stroke-linejoin="round" />
    <circle cx="75" cy="-75" r="3" fill="#155EEF" />
    <text x="125" y="-122" fill="#155EEF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1">PCD Ø190.0</text>
  </g>

  <!-- Branded Technical Typographic Header -->
  <g transform="translate(400, 480)">
    <rect x="-130" y="-18" width="260" height="26" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <text x="0" y="-1" fill="#155EEF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">INDUS ROBOTICS HARDWARE</text>
    
    <text x="0" y="28" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="0.5">PRECISION MECHATRONIC SCHEMATIC</text>
    <text x="0" y="48" fill="#64748B" font-family="monospace, monospace" font-size="10" text-anchor="middle" letter-spacing="1">ISO 9283 · DIN 3990 ARCHITECTURE</text>
  </g>

  <!-- Technical Calibration Corner Reticles -->
  <g stroke="#94A3B8" stroke-width="1.5">
    <path d="M 40 50 L 40 40 L 50 40" fill="none" />
    <path d="M 760 50 L 760 40 L 750 40" fill="none" />
    <path d="M 40 550 L 40 560 L 50 560" fill="none" />
    <path d="M 760 550 L 760 560 L 750 560" fill="none" />
  </g>
</svg>
