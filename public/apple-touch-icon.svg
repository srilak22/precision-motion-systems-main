<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <rect width="180" height="180" rx="36" fill="#101B2D" />
  <!-- Precision geometric grid lines in background -->
  <line x1="20" y1="90" x2="160" y2="90" stroke="rgba(35,136,255,0.15)" stroke-width="1.5" />
  <line x1="90" y1="20" x2="90" y2="160" stroke="rgba(35,136,255,0.15)" stroke-width="1.5" />
  <circle cx="90" cy="90" r="60" fill="none" stroke="rgba(22,199,232,0.12)" stroke-width="1.5" />
  
  <!-- Precision industrial gear accent -->
  <g transform="translate(130, 42)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#2388FF" stroke-width="3" stroke-dasharray="6, 3" />
    <circle cx="0" cy="0" r="5" fill="#2388FF" />
  </g>

  <!-- Bold INDUS Lettermark -->
  <text x="90" y="105" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">INDUS</text>
  <text x="90" y="128" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="13" fill="#64748B" text-anchor="middle" letter-spacing="5">ROBOTICS</text>
  
  <!-- Cyan Precision Baseline -->
  <rect x="50" y="142" width="80" height="4.5" rx="2" fill="#16C7E8" />
</svg>
